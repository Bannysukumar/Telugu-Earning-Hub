packages:
  "framer-motion": "For smooth page transitions and beautiful modal animations"
  "recharts": "For rendering investment and admin dashboard charts"
  "lucide-react": "For beautiful, consistent iconography across the platform"
  "sonner": "For elegant, modern toast notifications"
  "date-fns": "For formatting dates in a readable format"
  "react-hook-form": "For robust form state management"
  "@hookform/resolvers": "For integrating Zod validation with forms"
  "clsx": "For conditional class name merging"
  "tailwind-merge": "For resolving Tailwind class conflicts"

images:
  - path: "artifacts/roi-platform/public/images/hero-bg.png"
    description: "Abstract modern dark geometric shapes with subtle emerald green glowing accents, deep navy and black background, ultra-premium financial tech feel"
    aspect_ratio: "16:9"
  - path: "artifacts/roi-platform/public/images/logo.png"
    description: "Minimalist modern investment platform logo icon, geometric shape forming an upward trending chart, emerald green on transparent background"
    aspect_ratio: "1:1"

notes:
  - API uses cookie/localStorage for auth. We will use a fetch interceptor to inject the JWT token.
  - Orval generated hooks require passing body payloads inside a `{ data: payload }` object wrapper.
  - The UI uses a deep dark financial theme by default.

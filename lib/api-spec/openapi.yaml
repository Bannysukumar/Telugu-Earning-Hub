components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ReferralLookupResponse:
      type: object
      properties:
        valid:
          type: boolean
        sponsorName:
          type: string
          description: Sponsor full name when valid is true
        error:
          type: string
          description: Reason when valid is false
      required: [valid]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        confirmPassword:
          type: string
          minLength: 6
          description: Must match password; validated server-side and not stored.
        phone:
          type: string
          description: Mobile number; digits only are stored after normalization (10–15 digits).
        referralCode:
          type: string
          minLength: 2
          maxLength: 32
          description: Sponsor referral code (case-insensitive). Must match an existing user; validate with GET /auth/referral-lookup before submit.
        binaryPreferredSide:
          type: string
          enum: [left, right]
          description: Required when binary plan is enabled; join as sponsor's immediate left or right leg.
      required: [name, email, password, confirmPassword, phone, referralCode]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [user, admin]
        walletBalance:
          type: number
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        referralCode:
          type: string
          nullable: true
          description: Uppercase shareable code for referral signup links.
        qualifiedDirectReferrals:
          type: integer
          description: Count of direct referrals who activated at least one investment (withdrawal gate).
        referrerId:
          type: string
          nullable: true
          description: Direct sponsor user id when joined with a referral code.
        referrerName:
          type: string
          nullable: true
          description: Display name of direct sponsor (upline), when referred.
        referrerEmail:
          type: string
          nullable: true
          description: Email of direct sponsor (upline), when referred.
      required: [id, name, email, phone, role, walletBalance, isActive, createdAt, referralCode, qualifiedDirectReferrals, referrerId, referrerName, referrerEmail]

    AdminDirectMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]

    AdminUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [user, admin]
        walletBalance:
          type: number
        isActive:
          type: boolean
        totalInvested:
          type: number
        totalEarned:
          type: number
        activeInvestments:
          type: integer
        createdAt:
          type: string
          format: date-time
        referralCode:
          type: string
          nullable: true
          description: User's shareable referral code (uppercase), if assigned.
        directLeft:
          type: array
          description: Users who joined directly on this member's left leg (by referrerId + binarySide).
          items:
            $ref: "#/components/schemas/AdminDirectMember"
        directRight:
          type: array
          description: Users who joined directly on this member's right leg (by referrerId + binarySide).
          items:
            $ref: "#/components/schemas/AdminDirectMember"
      required: [id, name, email, phone, role, walletBalance, isActive, totalInvested, totalEarned, activeInvestments, createdAt, referralCode, directLeft, directRight]

    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        amount:
          type: number
        dailyRoi:
          type: number
        maxReturn:
          type: number
        maxDays:
          type: integer
        isActive:
          type: boolean
        description:
          type: string
        directBonus:
          type: number
          description: Rupees paid to direct sponsor on referral's first investment (default 20).
        binaryPairVolume:
          type: integer
          description: BV required on each leg to form one binary pair (default 200).
        binaryPairPayout:
          type: number
          description: Rupees paid per binary pair to upline (default 80).
        roiPoolPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Percent of plan dailyRoi credited each ROI day (default 100).
        levelIncomeEnabled:
          type: boolean
          description: When true, downline daily ROI pays uplines per this plan's level-income schedule (or global default when tiers are omitted).
        levelIncomeTiers:
          type: array
          description: Per-plan level schedule. Levels with 0% are disabled and receive no payout.
          items:
            $ref: "#/components/schemas/LevelIncomeTier"
        planKind:
          type: string
          enum: [mlm, standalone]
          description: Standalone = ROI only, no referral/binary, no gift activation, no 2-referral withdrawal gate.
      required: [id, name, amount, dailyRoi, maxReturn, maxDays, isActive, directBonus, binaryPairVolume, binaryPairPayout, roiPoolPercent, levelIncomeEnabled]

    CreatePlanRequest:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        dailyRoi:
          type: number
        maxReturn:
          type: number
        maxDays:
          type: integer
        isActive:
          type: boolean
        description:
          type: string
        directBonus:
          type: number
        binaryPairVolume:
          type: integer
        binaryPairPayout:
          type: number
        roiPoolPercent:
          type: integer
          minimum: 1
          maximum: 100
        levelIncomeEnabled:
          type: boolean
        levelIncomeTiers:
          type: array
          items:
            $ref: "#/components/schemas/LevelIncomeTier"
        planKind:
          type: string
          enum: [mlm, standalone]
      required: [name, amount, dailyRoi, maxReturn, maxDays]

    UpdatePlanRequest:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        dailyRoi:
          type: number
        maxReturn:
          type: number
        maxDays:
          type: integer
        isActive:
          type: boolean
        description:
          type: string
        directBonus:
          type: number
        binaryPairVolume:
          type: integer
        binaryPairPayout:
          type: number
        roiPoolPercent:
          type: integer
          minimum: 1
          maximum: 100
        levelIncomeEnabled:
          type: boolean
        levelIncomeTiers:
          type: array
          items:
            $ref: "#/components/schemas/LevelIncomeTier"
        planKind:
          type: string
          enum: [mlm, standalone]

    Investment:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        planName:
          type: string
        amount:
          type: number
        dailyRoi:
          type: number
        maxReturn:
          type: number
        totalEarned:
          type: number
        daysCompleted:
          type: integer
        maxDays:
          type: integer
        systemActive:
          type: boolean
        manualStatus:
          type: string
          enum: [active, inactive]
        isActive:
          type: boolean
        status:
          type: string
          enum: [active, completed, manually_stopped]
        startDate:
          type: string
          format: date-time
        lastRoiUpdate:
          type: string
          format: date-time
          nullable: true
        roiPoolPercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Snapshot from plan at activation; percent of dailyRoi paid each ROI day.
      required: [id, planId, planName, amount, dailyRoi, maxReturn, totalEarned, daysCompleted, maxDays, systemActive, manualStatus, isActive, status, startDate, roiPoolPercent]

    AdminInvestment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
        userEmail:
          type: string
        planId:
          type: string
        planName:
          type: string
        amount:
          type: number
        dailyRoi:
          type: number
        maxReturn:
          type: number
        totalEarned:
          type: number
        daysCompleted:
          type: integer
        maxDays:
          type: integer
        systemActive:
          type: boolean
        manualStatus:
          type: string
          enum: [active, inactive]
        isActive:
          type: boolean
        status:
          type: string
          enum: [active, completed, manually_stopped]
        startDate:
          type: string
          format: date-time
        lastRoiUpdate:
          type: string
          format: date-time
          nullable: true
        roiPoolPercent:
          type: integer
          minimum: 1
          maximum: 100
      required: [id, userId, userName, userEmail, planId, planName, amount, dailyRoi, maxReturn, totalEarned, daysCompleted, maxDays, systemActive, manualStatus, isActive, status, startDate, roiPoolPercent]

    AdminInvestmentListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminInvestment"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
      required: [items, total, page, pageSize, totalPages]

    AdminCreateInvestmentRequest:
      type: object
      properties:
        userId:
          type: string
        planId:
          type: string
      required: [userId, planId]

    AdminPatchInvestmentRequest:
      type: object
      properties:
        manualStatus:
          type: string
          enum: [active, inactive]
        systemActive:
          type: boolean
      description: At least one field should be provided

    IncomeHistoryEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        investmentId:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [ROI, ADJUSTMENT, WITHDRAWAL, INVESTMENT, REFERRAL_BONUS, BINARY_PAIR, LEVEL_INCOME]
        date:
          type: string
          format: date-time
        planAmount:
          type: number
        dayNumber:
          type: integer
        note:
          type: string
          nullable: true
        planName:
          type: string
          nullable: true
        feeAmount:
          type: number
          nullable: true
        netAmount:
          type: number
          nullable: true
      required: [id, userId, investmentId, amount, type, date, planAmount, dayNumber]

    IncomeHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncomeHistoryEntry"
        nextCursor:
          type: string
          nullable: true
      required: [items, nextCursor]

    CreateInvestmentRequest:
      type: object
      properties:
        planId:
          type: string
        beneficiaryUserId:
          type: string
          description: >-
            Optional. When set to another member's user id, that member receives the investment and
            the plan cost is debited from your wallet (sponsored activation). Omit or set to your own id to activate for yourself.
      required: [planId]

    WalletTransferRequest:
      type: object
      description: Exactly one destination field must be provided.
      properties:
        amount:
          type: number
          minimum: 1
        toUserId:
          type: string
        toEmail:
          type: string
          format: email
        toReferralCode:
          type: string
          minLength: 2
          maxLength: 32
      required: [amount]

    WalletTransferResponse:
      type: object
      properties:
        walletBalance:
          type: number
          description: Your wallet balance after the transfer
        recipientId:
          type: string
        recipientName:
          type: string
        feePercent:
          type: number
          description: Platform fee percent applied to this transfer (0–100)
        feeAmount:
          type: number
          description: Rupees retained by the platform from the gross amount sent
        recipientReceived:
          type: number
          description: Net amount credited to the recipient wallet
      required: [walletBalance, recipientId, recipientName, feePercent, feeAmount, recipientReceived]

    ResolvedMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        referralCode:
          type: string
          nullable: true
      required: [id, name, referralCode]

    WithdrawalFeeSettings:
      type: object
      properties:
        withdrawalFeePercent:
          type: number
          description: Effective percent for this member (custom override or global default).
        globalWithdrawalFeePercent:
          type: number
          description: Site-wide default from admin Settings.
        customWithdrawalFeePercent:
          type: number
          nullable: true
          description: Per-member override when set; null means use global default.
        peerTransferFeePercent:
          type: number
          description: Percent applied to peer wallet sends and gift-plan activations (0–100). Default 0 when unset.
        minWithdrawalAmount:
          type: number
          description: Minimum gross withdrawal request in ₹.
      required: [withdrawalFeePercent, peerTransferFeePercent, minWithdrawalAmount]

    AdminUserWithdrawalFee:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        customWithdrawalFeePercent:
          type: number
          nullable: true
          description: Admin-set override; null when using global default.
        effectiveWithdrawalFeePercent:
          type: number
          description: Fee applied on next withdrawal for this member.
        globalWithdrawalFeePercent:
          type: number
          description: Current site-wide default (Settings).
      required: [userId, name, email, effectiveWithdrawalFeePercent, globalWithdrawalFeePercent]

    AdminWithdrawalFeeRow:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        customWithdrawalFeePercent:
          type: number
          nullable: true
        effectiveWithdrawalFeePercent:
          type: number
      required: [userId, name, email, effectiveWithdrawalFeePercent]

    AdminWithdrawalFeeList:
      type: object
      properties:
        globalWithdrawalFeePercent:
          type: number
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminWithdrawalFeeRow"
      required: [globalWithdrawalFeePercent, users]

    AdminSetUserWithdrawalFeeRequest:
      type: object
      properties:
        withdrawalFeePercent:
          type: number
          minimum: 0
          maximum: 100
      required: [withdrawalFeePercent]

    PlatformFeatures:
      type: object
      properties:
        binaryPlanEnabled:
          type: boolean
          description: When false, binary UI and binary pair payouts are hidden/disabled site-wide.
        directIncomeEnabled:
          type: boolean
          description: When false, direct referral bonus payouts and per-plan direct bonus fields are hidden.
      required: [binaryPlanEnabled, directIncomeEnabled]

    LevelIncomeTier:
      type: object
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 32
          description: Generation from downline (1 = direct sponsor).
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Percent of downline credited daily ROI paid at this level.
      required: [level, percent]

    LevelIncomeConfig:
      type: object
      properties:
        levels:
          type: array
          items:
            $ref: "#/components/schemas/LevelIncomeTier"
        maxLevels:
          type: integer
          description: Maximum tiers allowed (32).
        defaultOnNewPlans:
          type: boolean
          description: When true, Create Plan enables level income by default (admin can turn off per plan).
      required: [levels, maxLevels, defaultOnNewPlans]

    AdminUpdateLevelIncomeRequest:
      type: object
      description: Send levels and/or defaultOnNewPlans (at least one).
      minProperties: 1
      properties:
        levels:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/LevelIncomeTier"
        defaultOnNewPlans:
          type: boolean

    AdminSettings:
      type: object
      properties:
        withdrawalFeePercent:
          type: number
        peerTransferFeePercent:
          type: number
        binaryPlanEnabled:
          type: boolean
        directIncomeEnabled:
          type: boolean
          description: When false, direct referral bonus is disabled and hidden on admin plan forms.
        standalonePlanCreationOnly:
          type: boolean
          description: When true, admin Create Plan only allows standalone (ROI-only) packages.
        minWithdrawalAmount:
          type: number
          description: Minimum gross withdrawal request in ₹.
      required: [withdrawalFeePercent, peerTransferFeePercent, binaryPlanEnabled, directIncomeEnabled, standalonePlanCreationOnly, minWithdrawalAmount]

    AdminUpdateSettingsRequest:
      type: object
      description: At least one property must be sent.
      minProperties: 1
      properties:
        withdrawalFeePercent:
          type: number
          minimum: 0
          maximum: 100
        peerTransferFeePercent:
          type: number
          minimum: 0
          maximum: 100
        binaryPlanEnabled:
          type: boolean
        directIncomeEnabled:
          type: boolean
        standalonePlanCreationOnly:
          type: boolean
        minWithdrawalAmount:
          type: number
          minimum: 1

    Withdrawal:
      type: object
      properties:
        id:
          type: string
        requestAmount:
          type: number
          description: Gross amount deducted from wallet
        feePercent:
          type: number
        feeAmount:
          type: number
        netAmount:
          type: number
          description: Amount user receives after fee (admin pays this on approval)
        status:
          type: string
          enum: [pending, approved, rejected]
        bankDetails:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        bankAccountSaveWarning:
          type: string
          nullable: true
          description: Present when withdrawal succeeded but profile could not store bank details (e.g. saved-account limit)
      required: [id, requestAmount, feePercent, feeAmount, netAmount, status, createdAt]


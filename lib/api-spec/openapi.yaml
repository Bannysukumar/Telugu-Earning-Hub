openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: ROI Investment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: plans
    description: Investment plan operations
  - name: investments
    description: Investment operations
  - name: withdrawals
    description: Withdrawal operations
  - name: admin
    description: Admin operations
  - name: cron
    description: Cron/automation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /platform/features:
    get:
      operationId: getPlatformFeatures
      tags: [health]
      summary: Public platform feature flags (binary plan visibility)
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformFeatures"

  /auth/referral-lookup:
    get:
      operationId: getReferralLookup
      tags: [auth]
      summary: Validate a sponsor referral code and return the sponsor display name (before register)
      parameters:
        - name: code
          in: query
          required: true
          description: Sponsor referral code (case-insensitive)
          schema:
            type: string
            minLength: 2
            maxLength: 32
      responses:
        "200":
          description: Whether the code matches an active sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralLookupResponse"
        "400":
          description: Missing or invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: Get all active investment plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /investments:
    get:
      operationId: getMyInvestments
      tags: [investments]
      summary: Get current user's investments
      responses:
        "200":
          description: List of investments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createInvestment
      tags: [investments]
      summary: Activate a plan (deducts from your wallet). Optionally activate for another member you sponsor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvestmentRequest"
      responses:
        "201":
          description: Investment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cannot activate for inactive or admin target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plan or beneficiary not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /withdrawals:
    get:
      operationId: getMyWithdrawals
      tags: [withdrawals]
      summary: Get current user's withdrawal requests
      responses:
        "200":
          description: List of withdrawals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithdrawalRequest"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Insufficient balance or minimum not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already has a pending withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too soon after the last withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /withdrawals/fee-settings:
    get:
      operationId: getWithdrawalFeeSettings
      tags: [withdrawals]
      summary: Current withdrawal fee percent (for display before requesting)
      responses:
        "200":
          description: Fee settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalFeeSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/dashboard:
    get:
      operationId: getDashboard
      tags: [users]
      summary: Get dashboard stats for current user
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/change-password:
    put:
      operationId: changePassword
      tags: [users]
      summary: Change account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password updated; returns a fresh login token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          description: Invalid input or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated or current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/profile:
    put:
      operationId: updateProfile
      tags: [users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/bank-accounts:
    get:
      operationId: listMyBankAccounts
      tags: [users]
      summary: List saved withdrawal bank accounts
      responses:
        "200":
          description: Saved accounts (for reuse on withdrawal)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedBankAccount"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMyBankAccount
      tags: [users]
      summary: Add or merge a saved bank account (by IFSC + account number)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedBankAccountRequest"
      responses:
        "201":
          description: Account saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBankAccount"
        "400":
          description: Invalid input or account limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/bank-accounts/{accountId}:
    put:
      operationId: updateMyBankAccount
      tags: [users]
      summary: Update a saved bank account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSavedBankAccountRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBankAccount"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate IFSC + account number vs another saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyBankAccount
      tags: [users]
      summary: Remove a saved bank account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/wallet/transfer:
    post:
      operationId: transferWalletToUser
      tags: [users]
      summary: Transfer wallet balance to another member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTransferRequest"
      responses:
        "200":
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransferResponse"
        "400":
          description: Invalid input or transfer rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recipient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/members/resolve:
    get:
      operationId: resolveMemberForTransfer
      tags: [users]
      summary: Resolve another member by user id, email, or referral code (for transfers / gifting)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
            description: Member email (trimmed; lookup is case-insensitive via Firebase Auth when needed)
        - name: referralCode
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Member found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedMember"
        "400":
          description: Invalid or ambiguous query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/income-history:
    get:
      operationId: getMyIncomeHistory
      tags: [users]
      summary: Paginated ROI and income history for current user
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Income history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeHistoryPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/direct-level:
    get:
      operationId: getMyDirectLevel
      tags: [users]
      summary: Direct referrals (sponsor level) for the current user
      responses:
        "200":
          description: List of direct referrals with activation stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectLevelResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/sponsor-tree:
    get:
      operationId: getMySponsorTree
      summary: Unilevel sponsor tree for investment-plan genealogy
      tags: [User]
      security:
        - cookieAuth: []
      parameters:
        - name: maxDepth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 5
      responses:
        "200":
          description: Sponsor tree rooted at the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorTreeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/binary-tree:
    get:
      operationId: getMyBinaryTree
      tags: [users]
      summary: Binary placement tree under the current user (left/right legs)
      parameters:
        - name: maxDepth
          in: query
          required: false
          description: Maximum depth below you to load (1 = only your immediate binary children)
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 5
      responses:
        "200":
          description: Recursive binary tree rooted at the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BinaryTreeResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/payment-settings:
    get:
      operationId: getUserPaymentSettings
      tags: [users]
      summary: QR / manual deposit settings for add-fund flow
      responses:
        "200":
          description: Payment settings (public fields only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/deposits/generate-payment:
    post:
      operationId: generateDepositPayment
      tags: [users]
      summary: Create dynamic UPI payment link and QR payload for a deposit amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDepositPaymentRequest"
      responses:
        "200":
          description: UPI deep link for the amount (one random UPI ID from admin list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDepositPaymentResponse"
        "400":
          description: Invalid amount or deposits disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: UPI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/deposits:
    get:
      operationId: getMyDeposits
      tags: [users]
      summary: Deposit requests and history for current user
      responses:
        "200":
          description: Pending deposit (if any) and full history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDepositsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/payment-settings:
    get:
      operationId: adminGetPaymentSettings
      tags: [admin]
      summary: Admin - Get QR payment settings
      responses:
        "200":
          description: Payment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdatePaymentSettings
      tags: [admin]
      summary: Admin - Update QR URL and/or enable flag (use POST /admin/payment-settings/qr to upload image)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdatePaymentSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/deposits:
    get:
      operationId: adminGetDeposits
      tags: [admin]
      summary: Admin - List all manual deposit requests
      responses:
        "200":
          description: Deposits newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDeposit"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/deposits/{depositId}:
    put:
      operationId: adminUpdateDeposit
      tags: [admin]
      summary: Admin - Approve or reject a deposit (approve credits wallet)
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateDepositRequest"
      responses:
        "200":
          description: Updated deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeposit"
        "400":
          description: Invalid or already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: adminGetUsers
      tags: [admin]
      summary: Admin - Get all users
      responses:
        "200":
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/withdrawal-fees:
    get:
      operationId: adminGetWithdrawalFees
      tags: [admin]
      summary: List members with global and per-user withdrawal fee
      responses:
        "200":
          description: Withdrawal fee list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalFeeList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/withdrawal-fee:
    put:
      operationId: adminSetUserWithdrawalFee
      tags: [admin]
      summary: Set a custom withdrawal fee for one member
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetUserWithdrawalFeeRequest"
      responses:
        "200":
          description: Updated fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserWithdrawalFee"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminClearUserWithdrawalFee
      tags: [admin]
      summary: Remove custom withdrawal fee (use global default)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cleared custom fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserWithdrawalFee"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/sponsor-tree:
    get:
      operationId: adminGetUserSponsorTree
      summary: Unilevel sponsor tree for a member (investment plan team)
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: maxDepth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 5
      responses:
        "200":
          description: Sponsor tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorTreeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/binary-tree:
    get:
      operationId: adminGetUserBinaryTree
      tags: [admin]
      summary: Admin - Get binary tree for any user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: maxDepth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
